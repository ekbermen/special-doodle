          function runAction(f,a){if(['open','edit','convert','censor','export','resize','compress'].includes(a)){openFile(f,a);return}if(a==='pdf-export'||a==='split'){openFile(f,a);return}if(a==='merge'){mergePdfs();return}if(a==='run'){runFileCode(f);return}if(a==='format'){if(f.ext==='json'){openFile(f,'format')}else{runFileCode(f);toast('Editörde biçimlendirme araçları kullanılabilir.')}return}if(a==='play'){openFile(f);return}if(a==='thumbnail'){extractLocalThumbnail(f);return}if(a==='download'){downloadBlob(f.file,f.name);return}if(a==='copy'){navigator.clipboard?.writeText(f.name).then(()=>toast('Dosya adı kopyalandı.')).catch(()=>toast('Panoya erişim izni verilmedi.'));return}if(a==='copy-content'){readText(f).then(t=>navigator.clipboard?.writeText(t).then(()=>toast('Dosya içeriği kopyalandı.')).catch(()=>toast('Panoya erişim izni verilmedi.')));return}if(a==='share'){if(navigator.share)navigator.share({title:f.name,text:'NOVA Studio dosyası: '+f.name}).catch(()=>{});else toast('Bu tarayıcı paylaşım menüsünü desteklemiyor.');return}if(a==='info'){alert('Dosya: '+f.name+'\nTür: '+f.ext.toUpperCase()+'\nBoyut: '+sizeText(f.size)+'\nİşlem: tarayıcı içinde');return}if(a==='remove'){files=files.filter(x=>x.id!==f.id);URL.revokeObjectURL(f.url);renderFiles();toast('Dosya çalışma alanından kaldırıldı.');}}
          function openFile(f,mode){active=f;$('#workTitle').textContent=f.name;$('#downloadOriginal').onclick=()=>downloadBlob(f.file,f.name);showPage('workspace');const p=$('#workPanel');p.innerHTML='';if(imageExt.includes(f.ext))renderImage(f,mode);else if(f.ext==='pdf')renderPdf(f,mode);else if(mediaExt.includes(f.ext))renderMedia(f);else renderTextFile(f,mode)}
          function addToolButton(parent,label,fn,cls=''){const b=document.createElement('button');b.className='btn small '+cls;b.textContent=label;b.addEventListener('click',fn);parent.appendChild(b);return b}
          function renderImage(f,mode){
