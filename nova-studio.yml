          function resizeCurrentImage(){if(!imageCanvas)return;const w=Number(prompt('Yeni genişlik (px)',String(imageCanvas.width)));if(!Number.isFinite(w)||w<1||w>8000)return;const h=Number(prompt('Yeni yükseklik (px)',String(Math.round(imageCanvas.height*w/imageCanvas.width))));if(!Number.isFinite(h)||h<1||h>8000)return;const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(imageCanvas,0,0,w,h);imageCanvas.width=w;imageCanvas.height=h;imageCtx=imageCanvas.getContext('2d');imageCtx.drawImage(c,0,0);toast('Görsel yeniden boyutlandırıldı.')}
