          async function mergePdfs(){const list=files.filter(f=>f.ext==='pdf');if(list.length<2){toast('Birleştirmek için en az iki PDF ekle.');return}try{await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');const out=await PDFLib.PDFDocument.create();for(const f of list){const doc=await PDFLib.PDFDocument.load(await f.file.arrayBuffer());const pages=await out.copyPages(doc,doc.getPageIndices());pages.forEach(p=>out.addPage(p))}downloadBlob(new Blob([await out.save()],{type:'application/pdf'}),'nova-merged.pdf');toast(list.length+' PDF birleştirildi.')}catch(e){toast('PDF birleştirme hatası: '+e.message)}}
          function extractLocalThumbnail(f){
           const v=document.createElement('video');v.preload='metadata';v.muted=true;v.src=f.url;let done=false;
           const capture=()=>{if(done||!v.videoWidth)return;done=true;try{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{if(b)downloadBlob(b,f.name.replace(/\.[^.]+$/,'')+'-thumbnail.jpg')},'image/jpeg',.92)}catch(e){toast('Video karesi çıkarılamadı.')}};
