          async function renderPdf(f,mode){const panel=$('#workPanel'),bar=document.createElement('div');bar.className='toolrow';panel.appendChild(bar);addToolButton(bar,'Önceki sayfa',()=>showPdfPage(Math.max(1,pdfPage-1)));addToolButton(bar,'Sonraki sayfa',()=>showPdfPage(pdfPage+1));addToolButton(bar,'Sayfayı PNG indir',exportPdfPage);addToolButton(bar,'PDF sayfalarını ayır',splitPdf);addToolButton(bar,'Açık PDF dosyalarını birleştir',mergePdfs,'primary');const stage=document.createElement('div');stage.className='stage';const cv=document.createElement('canvas');cv.id='pdfCanvas';stage.appendChild(cv);panel.appendChild(stage);const status=document.createElement('div');status.className='control-row';status.id='pdfStatus';status.textContent='PDF yükleniyor...';panel.appendChild(status);try{const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';pdfDoc=await pdfjs.getDocument({data:new Uint8Array(await f.file.arrayBuffer())}).promise;pdfPage=1;status.textContent=pdfDoc.numPages+' sayfa';await showPdfPage(1);if(mode==='pdf-export')exportPdfPage();if(mode==='split')splitPdf()}catch(e){status.textContent='PDF görüntülenemedi: '+e.message;const fr=document.createElement('iframe');fr.src=f.url;stage.innerHTML='';stage.appendChild(fr)}}
          async function showPdfPage(n){if(!pdfDoc)return;if(n<1||n>pdfDoc.numPages)return;pdfPage=n;const page=await pdfDoc.getPage(n),viewport=page.getViewport({scale:1.4}),cv=$('#pdfCanvas');cv.width=viewport.width;cv.height=viewport.height;await page.render({canvasContext:cv.getContext('2d'),viewport}).promise;$('#pdfStatus').textContent=`Sayfa ${n} / ${pdfDoc.numPages}`}
