name: NOVA Studio — Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: nova-studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create the complete single-file web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/index.html <<'NOVA_HTML'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#10131b"><meta name="description" content="NOVA Studio — yerel dosya araçları, kod laboratuvarı ve beyaz tahta.">
          <title>NOVA Studio</title>
          <style>
          :root{color-scheme:dark;--bg:#0d1017;--panel:#151a24;--panel2:#1b2230;--line:#293244;--text:#edf2fa;--muted:#98a5b8;--accent:#8b9cff;--accent2:#b49aff;--good:#6ed2ae;--danger:#ff7e88;--shadow:0 18px 55px #0006;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#29345b55,transparent 44%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 16px;border-right:1px solid var(--line);background:#10141dcc;backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:25px;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8296ff,#b18af7);display:grid;place-items:center;color:#111827;font-weight:900;letter-spacing:-2px;box-shadow:0 8px 25px #8296ff44}.brand strong{font-size:16px;letter-spacing:.13em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;margin-top:3px}.nav-label{font-size:10px;letter-spacing:.16em;color:#78869b;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb8c9;text-align:left;padding:12px;border-radius:11px;display:flex;gap:12px;align-items:center;font-size:13px;transition:.18s}.nav button:hover,.nav button.active{background:#252d40;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--accent)}.nav .ico{width:18px;text-align:center;color:#a9b5cc;font-size:16px}.side-bottom{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:13px;background:#171d29}.side-bottom strong{font-size:12px}.side-bottom p{font-size:11px;line-height:1.5;color:var(--muted);margin:7px 0 0}.main{min-width:0;padding:28px clamp(16px,3vw,42px) 60px;max-width:1600px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.topbar h1{font-size:clamp(23px,3vw,32px);margin:5px 0 0;letter-spacing:-.04em}.top-actions{display:flex;align-items:center;gap:9px}.search{width:min(260px,27vw);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--text)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:650;transition:.18s}.btn:hover{border-color:#66769a;transform:translateY(-1px)}.btn.primary{background:linear-gradient(120deg,#8497ff,#a18af3);border:0;color:#101421}.btn.ghost{background:transparent}.btn.danger{color:#ff9da5}.btn.small{padding:7px 10px;font-size:11px}.iconbtn{width:39px;height:39px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:28px}.dropzone{min-height:220px;border:1px dashed #6676a3;border-radius:18px;padding:27px;background:linear-gradient(135deg,#1b2234,#151a25 75%);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;position:relative;overflow:hidden;transition:.2s}.dropzone:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#8999ff12;right:-55px;top:-90px}.dropzone.drag{border-color:#a8b4ff;background:#252d45}.drop-icon{width:46px;height:46px;border:1px solid #56648a;background:#282f48;border-radius:14px;display:grid;place-items:center;font-size:20px;margin-bottom:18px}.dropzone h2{font-size:21px;margin:0 0 7px;letter-spacing:-.03em}.dropzone p{font-size:12px;color:var(--muted);margin:0 0 17px;line-height:1.6}.drop-meta{font-size:10px;color:#75839a;margin-top:12px}.quick-panel{border:1px solid var(--line);border-radius:18px;padding:20px;background:linear-gradient(145deg,#171e2c,#141923);display:flex;flex-direction:column;justify-content:space-between}.quick-panel h3{font-size:15px;margin:0}.quick-panel p{font-size:11px;color:var(--muted);line-height:1.6}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{border:1px solid var(--line);border-radius:10px;padding:11px;background:#20283a;text-align:left;color:var(--text);font-size:11px}.quick b{display:block;font-size:17px;color:#aebaff;margin-bottom:4px;font-weight:600}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-head h2{font-size:16px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 10px;font-size:10px}.filter.active{background:#2b3550;border-color:#6377b2;color:#fff}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.file-card{min-width:0;position:relative;border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(150deg,#171e2a,#131823);transition:.18s;user-select:none;touch-action:pan-y}.file-card:hover{border-color:#63739a;transform:translateY(-2px);box-shadow:0 12px 32px #0003}.file-preview{height:90px;border-radius:9px;background:#222b3b;display:grid;place-items:center;margin-bottom:12px;overflow:hidden;color:#acb9dc;font-size:25px}.file-preview img,.file-preview video{width:100%;height:100%;object-fit:cover}.file-ext{position:absolute;top:22px;left:22px;padding:4px 6px;border-radius:5px;background:#111925dd;color:#dfe6ff;font-size:9px;letter-spacing:.08em}.file-name{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-top:6px}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.view{min-width:0}.workspace-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}.workspace-head h2{font-size:18px;margin:0;flex:1;overflow-wrap:anywhere}.work-panel{border:1px solid var(--line);border-radius:16px;background:#131923;min-height:420px;overflow:hidden}.toolrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line);background:#171e2b}.stage{padding:16px;min-height:380px;display:grid;place-items:center;overflow:auto}.stage canvas{max-width:100%;max-height:68vh;object-fit:contain;border-radius:5px;box-shadow:0 10px 35px #0004;background:#fff}.stage iframe{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:white}.stage video,.stage audio{max-width:100%;width:min(900px,100%)}.stage img{max-width:100%;max-height:70vh;object-fit:contain}.control-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.control-row label{display:flex;align-items:center;gap:7px}.control-row input[type=range]{width:100px;accent-color:var(--accent)}.control-row input[type=number],.control-row select,.control-row input[type=text]{background:#0e131c;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px;width:90px}.editor{width:100%;min-height:360px;resize:vertical;background:#0b1018;color:#dbe5fb;border:1px solid #293449;border-radius:10px;padding:17px;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.editor-wrap{width:100%;display:grid;gap:10px}.output{white-space:pre-wrap;overflow:auto;background:#0a0f17;color:#d0ddf2;border:1px solid var(--line);padding:14px;border-radius:9px;min-height:80px;max-height:230px;font:11px/1.6 ui-monospace,monospace;width:100%}.data-table{border-collapse:collapse;width:100%;font-size:11px}.data-table td,.data-table th{border:1px solid var(--line);padding:8px;text-align:left}.data-table th{background:#20283a}.url-box{display:flex;gap:8px;width:100%}.url-box input{flex:1;min-width:0;background:#0d131d;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text)}.link-result{width:100%;display:grid;gap:12px}.link-result iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#090d14}.link-result video{width:100%;max-height:65vh;background:#000}.board-toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border:1px solid var(--line);border-radius:14px 14px 0 0;background:#171e2a}.board-toolbar button.active{background:#354164;border-color:#8192d1}.board-wrap{height:min(72vh,760px);min-height:420px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;background:#111722;position:relative}.board-wrap svg{width:100%;height:100%;touch-action:none;display:block}.board-help{position:absolute;bottom:12px;left:14px;padding:7px 9px;border-radius:7px;background:#0d131dcc;color:#94a1b8;font-size:10px;pointer-events:none}.radial{position:fixed;z-index:30;width:260px;height:260px;pointer-events:none;transform:translate(-50%,-50%)}.radial:before{content:"";position:absolute;inset:0;border:1px solid #8495d866;background:#0c1220eF;border-radius:50%;box-shadow:0 15px 65px #000b;backdrop-filter:blur(20px)}.radial-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#29344b;border:1px solid #7584b1;display:grid;place-items:center;overflow:hidden;color:#cbd6ff;font-size:18px}.radial-center img{width:100%;height:100%;object-fit:cover}.radial button{pointer-events:auto;position:absolute;left:50%;top:50%;width:67px;height:48px;margin:-24px 0 0 -33.5px;border:1px solid #45516d;border-radius:12px;background:#202a3c;color:#e8edfb;font-size:10px;font-weight:650;box-shadow:0 5px 14px #0005}.radial button:hover{background:#46557b;border-color:#a7b4f5}.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:#252f43;border:1px solid #536489;border-radius:11px;padding:12px 15px;box-shadow:var(--shadow);font-size:12px;max-width:min(360px,90vw)}.modal-backdrop{position:fixed;inset:0;z-index:50;background:#05070bc9;display:grid;place-items:center;padding:16px}.modal{width:min(550px,100%);border:1px solid var(--line);border-radius:17px;background:#171e2b;padding:20px;box-shadow:var(--shadow)}.modal h3{margin:0 0 8px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}.modal-actions{display:flex;justify-content:end;gap:8px;margin-top:16px}.mobile-head{display:none}
          @media(max-width:900px){.app{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand{justify-content:center;padding:0}.brand-copy,.nav-label,.nav button span:last-child,.side-bottom{display:none}.nav button{justify-content:center;padding:13px}.nav .ico{font-size:18px}.hero{grid-template-columns:1fr}.quick-panel{gap:10px}.main{padding:22px 18px 50px}}
          @media(max-width:600px){.app{display:block}.sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:66px;padding:6px 8px;border-right:0;border-top:1px solid var(--line);display:block}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:3px}.nav button{padding:10px 12px;flex:1;justify-content:center}.nav button span:last-child{display:none}.main{padding:19px 13px 92px}.topbar{align-items:flex-start}.topbar h1{font-size:23px}.search{display:none}.hero{gap:10px}.dropzone{min-height:195px;padding:20px}.quick-panel{padding:15px}.file-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.file-card{padding:10px}.file-preview{height:78px}.section-head{align-items:flex-start;flex-direction:column}.workspace-head h2{font-size:15px}.stage{padding:8px;min-height:300px}.stage iframe{height:58vh}.board-wrap{height:65vh;min-height:360px}.radial{width:250px;height:250px}}
          </style>
          </head>
          <body>
          <div class="app">
          <aside class="sidebar">
            <div class="brand"><div class="brand-mark">N.</div><div class="brand-copy"><strong>NOVA</strong><small>FILE STUDIO</small></div></div>
            <div><div class="nav-label">WORKSPACE</div><nav class="nav">
              <button class="active" data-page="home"><span class="ico">⌂</span><span>Genel bakış</span></button>
              <button data-page="board"><span class="ico">▦</span><span>Beyaz tahta</span></button>
              <button data-page="links"><span class="ico">↗</span><span>Bağlantı stüdyosu</span></button>
              <button data-page="code"><span class="ico">‹›</span><span>Kod laboratuvarı</span></button>
            </nav></div>
            <div><div class="nav-label">LIBRARY</div><nav class="nav">
              <button data-page="home" data-filter="image"><span class="ico">▧</span><span>Görseller</span></button>
              <button data-page="home" data-filter="pdf"><span class="ico">▤</span><span>PDF belgeleri</span></button>
              <button data-page="home" data-filter="code"><span class="ico">⌘</span><span>Kod dosyaları</span></button>
            </nav></div>
            <div class="side-bottom"><strong>Yerel çalışma alanı</strong><p>Dosyaların bu tarayıcıda işlenir. Dosya içeriği NOVA sunucusuna yüklenmez.</p><p style="font-size:9px">Açık kaynak bileşenler: PDF.js · pdf-lib · Pyodide</p></div>
          </aside>
          <main class="main">
          <header class="topbar"><div><div class="eyebrow">YOUR CREATIVE WORKSPACE</div><h1 id="pageTitle">Dosya stüdyosu</h1></div><div class="top-actions"><input id="search" class="search" placeholder="Dosyalarda ara..."><button class="iconbtn" id="themeBtn" title="Tema">◐</button><button class="btn primary" id="topUpload">Dosya ekle</button></div></header>
          <section id="homePage" class="view">
            <div class="hero">
              <div id="dropzone" class="dropzone"><div class="drop-icon">↥</div><h2>Dosyalarını buraya bırak</h2><p>Görsel, PDF, video, ses, tablo veya kod dosyalarını ekle.<br>İşlemler cihazında, tarayıcı içinde yapılır.</p><button class="btn primary" id="browseBtn">Dosya seç</button><div class="drop-meta">18 uzantı · En fazla 25 MB / dosya · Hesap gerektirmez</div></div>
              <div class="quick-panel"><div><h3>Tek çalışma alanı</h3><p>Dönüştür, düzenle, önizle, çalıştır ve fikirlerini aynı yerde topla.</p></div><div class="quick-grid"><button class="quick" data-page="board"><b>01</b>Beyaz tahta</button><button class="quick" data-page="links"><b>02</b>Video bağlantısı</button><button class="quick" data-page="code"><b>03</b>Kod laboratuvarı</button><button class="quick" id="mergeQuick"><b>04</b>PDF birleştir</button></div></div>
            </div>
            <div class="section-head"><div><h2>Son eklenen dosyalar</h2><p>Dosyaya tıkla ve aç. Basılı tutarak hızlı işlem menüsünü kullan.</p></div><div class="filters"><button class="filter active" data-kind="all">Tümü</button><button class="filter" data-kind="image">Görsel</button><button class="filter" data-kind="pdf">PDF</button><button class="filter" data-kind="media">Medya</button><button class="filter" data-kind="code">Kod</button></div></div>
            <div id="fileGrid" class="file-grid"><div class="empty">Henüz dosya eklenmedi. Başlamak için bir dosya yükle.</div></div>
          </section>
          <section id="workspace" class="view hidden"><div class="workspace-head"><button class="btn ghost small" id="backHome">← Geri</button><h2 id="workTitle">Dosya</h2><button class="btn small" id="downloadOriginal">Orijinali indir</button></div><div id="workPanel" class="work-panel"></div></section>
          <section id="boardPage" class="view hidden"><div class="section-head"><div><h2>Sonsuz fikir alanı</h2><p>Çiz, şekil ekle, notlarını yerleştir ve panonu dışa aktar.</p></div><div><button class="btn small" id="boardSave">JSON kaydet</button> <button class="btn small primary" id="boardPng">PNG dışa aktar</button></div></div><div class="board-toolbar"><button class="btn small active" data-tool="select">Seç</button><button class="btn small" data-tool="pen">Kalem</button><button class="btn small" data-tool="line">Çizgi</button><button class="btn small" data-tool="rect">Dikdörtgen</button><button class="btn small" data-tool="ellipse">Daire</button><button class="btn small" data-tool="text">Metin</button><button class="btn small" data-tool="note">Yapışkan not</button><button class="btn small" data-tool="eraser">Silgi</button><input id="boardColor" type="color" value="#aab8ff" title="Renk" style="width:34px;height:32px;background:transparent;border:0"><button class="btn small" id="boardZoomOut">−</button><button class="btn small" id="boardZoomIn">+</button><button class="btn small" id="boardClear">Temizle</button></div><div class="board-wrap"><svg id="boardSvg" viewBox="0 0 2000 1200" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#273145" stroke-width="1"/></pattern></defs><rect width="2000" height="1200" fill="#121926"/><rect width="2000" height="1200" fill="url(#gridPattern)"/><g id="boardItems"></g></svg><div class="board-help">Araç seç · Çizim için sürükle · Tekerlek ile yakınlaştır</div></div></section>
          <section id="linksPage" class="view hidden"><div class="section-head"><div><h2>Bağlantı stüdyosu</h2><p>Video bağlantısını yapıştır. Desteklenen videoları önizle veya kendi videondan kapak görseli çıkar.</p></div></div><div class="work-panel" style="padding:18px"><div class="url-box"><input id="mediaUrl" type="url" placeholder="https://... video bağlantısı"><button class="btn primary" id="loadUrl">Önizle</button></div><div id="linkResult" class="stage" style="min-height:230px;margin-top:12px;border:1px dashed var(--line);border-radius:12px"><div style="color:var(--muted);font-size:12px">Video bağlantısı burada görüntülenecek.</div></div><div style="padding:12px 2px;color:var(--muted);font-size:11px;line-height:1.6">Platform kısıtlamaları veya CORS nedeniyle her bağlantı doğrudan indirilemez. Korumalı platform videoları indirilmez; yalnızca izin verilen önizleme ve küçük resim seçenekleri sunulur.</div></div></section>
          <section id="codePage" class="view hidden"><div class="section-head"><div><h2>Kod laboratuvarı</h2><p>HTML, CSS ve JavaScript önizlemesi; Python'u tarayıcı içindeki ayrı Worker ortamında çalıştır.</p></div></div><div class="work-panel" style="padding:16px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><select id="codeLang" class="btn"><option value="html">HTML</option><option value="css">CSS</option><option value="js">JavaScript</option><option value="py">Python</option></select><button class="btn primary" id="runCode">Çalıştır / Önizle</button><button class="btn" id="saveCode">Dosya olarak kaydet</button><button class="btn" id="formatCode">Biçimlendir</button></div><textarea id="codeEditor" class="editor" spellcheck="false" aria-label="Kod editörü"><!doctype html>\n<html>\n<head><title>Merhaba NOVA</title></head>\n<body>\n  <h1>Merhaba dünya</h1>\n  <p>Kod laboratuvarına hoş geldin.</p>\n</body>\n</html></textarea><div style="display:flex;justify-content:space-between;margin:9px 0;color:var(--muted);font-size:10px"><span id="codeStatus">Hazır</span><span id="codeLines">7 satır</span></div><div id="codeOutput" class="output">Çıktı burada görünecek.</div><iframe id="codePreview" class="hidden" sandbox="allow-scripts" title="Kod önizlemesi" style="width:100%;height:260px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-top:12px"></iframe></div></section>
          </main></div>
          <input id="fileInput" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.svg,.pdf,.txt,.md,.csv,.json,.xml,.html,.css,.js,.py,.mp4,.webm,.mp3" hidden>
          <div id="radial" class="radial hidden"><div id="radialCenter" class="radial-center">N.</div></div><div id="toast" class="toast hidden" role="status"></div>
          <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
          <script>
          (()=>{'use strict';
          const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
          const MAX=25*1024*1024, accepted=new Set(['png','jpg','jpeg','webp','svg','pdf','txt','md','csv','json','xml','html','css','js','py','mp4','webm','mp3']);
          let files=[],active=null,filter='all',toastTimer=null,radialTimer=null,radialRecord=null,suppressClick=false,activeImage=null,imageCanvas=null,imageCtx=null,imageSource=null,imageMode='view',imageFilters={brightness:100,contrast:100,saturate:100},pdfDoc=null,pdfPage=1;
          const imageExt=['png','jpg','jpeg','webp','svg'],codeExt=['html','css','js','py'],mediaExt=['mp4','webm','mp3'];
          function extOf(n){return (n.split('.').pop()||'').toLowerCase()}function kindOf(e){return imageExt.includes(e)?'image':e==='pdf'?'pdf':mediaExt.includes(e)?'media':codeExt.includes(e)?'code':'other'}
          function sizeText(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
          function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
