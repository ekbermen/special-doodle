          async function imageToPdf(){if(!imageCanvas)return;try{await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');const doc=await PDFLib.PDFDocument.create(),png=await new Promise(resolve=>imageCanvas.toBlob(resolve,'image/png')),bytes=new Uint8Array(await png.arrayBuffer()),img=await doc.embedPng(bytes),page=doc.addPage([img.width,img.height]);page.drawImage(img,{x:0,y:0,width:img.width,height:img.height});downloadBlob(new Blob([await doc.save()],{type:'application/pdf'}),active.name.replace(/\.[^.]+$/,'')+'.pdf')}catch(e){toast('PDF oluşturulamadı: '+e.message)}}
