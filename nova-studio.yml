          function addFiles(list){let added=0;for(const f of list){const e=extOf(f.name);if(!accepted.has(e)){toast('Bu dosya türü henüz desteklenmiyor: '+f.name);continue}if(f.size>MAX){toast(f.name+' 25 MB sınırını aşıyor.');continue}const rec={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),file:f,name:f.name,size:f.size,ext:e,type:f.type||'',url:URL.createObjectURL(f),text:null};files.unshift(rec);added++}renderFiles();if(added)toast(added+' dosya eklendi. Dosyalar bu oturumda yerel olarak tutuluyor.')}
          function renderFiles(){const grid=$('#fileGrid'),q=($('#search').value||'').toLowerCase();let list=files.filter(f=>(filter==='all'||kindOf(f.ext)===filter)&&f.name.toLowerCase().includes(q));grid.innerHTML='';if(!list.length){grid.innerHTML='<div class="empty">'+(files.length?'Bu filtrede dosya yok.':'Henüz dosya eklenmedi. Başlamak için bir dosya yükle.')+'</div>';return}for(const f of list){const card=document.createElement('article');card.className='file-card';card.dataset.id=f.id;let preview=`<div class="file-preview">${iconFor(f.ext)}</div>`;if(imageExt.includes(f.ext)&&f.ext!=='svg')preview=`<div class="file-preview"><img src="${f.url}" alt=""></div>`;else if(['mp4','webm'].includes(f.ext))preview=`<div class="file-preview"><video src="${f.url}" muted preload="metadata"></video></div>`;card.innerHTML=preview+`<span class="file-ext">${f.ext.toUpperCase()}</span><div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div><div class="file-meta"><span>${sizeText(f.size)}</span><span>${kindOf(f.ext).toUpperCase()}</span></div>`;
