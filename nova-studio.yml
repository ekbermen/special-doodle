          async function renderTextFile(f,mode){const raw=await readText(f),p=$('#workPanel');p.innerHTML='';const bar=document.createElement('div');bar.className='toolrow';p.appendChild(bar);const isCode=codeExt.includes(f.ext);addToolButton(bar,'Düzenle',()=>renderTextFile(f,'edit'),mode==='edit'?'primary':'');if(isCode&&['html','css','js','py'].includes(f.ext))addToolButton(bar,'Çalıştır / önizle',()=>runFileCode(f));addToolButton(bar,'Biçimlendir',()=>{try{if(f.ext==='json')editor.value=JSON.stringify(JSON.parse(editor.value),null,2);else toast('Bu dosya türü için otomatik biçimlendirme yok.')}catch(e){toast('JSON biçimi geçersiz.')}});addToolButton(bar,'Kaydet',()=>downloadBlob(new Blob([editor.value],{type:'text/plain;charset=utf-8'}),f.name),'primary');const stage=document.createElement('div');stage.className='stage';const wrap=document.createElement('div');wrap.className='editor-wrap';const editor=document.createElement('textarea');editor.className='editor';editor.value=f.ext==='json'?(()=>{try{return JSON.stringify(JSON.parse(raw),null,2)}catch{return raw}})():raw;editor.readOnly=mode!=='edit'&&!isCode;wrap.appendChild(editor);if(f.ext==='csv'){const table=document.createElement('div');table.style.width='100%';table.style.overflow='auto';table.innerHTML=csvHtml(raw);wrap.insertBefore(table,editor);if(mode!=='edit')editor.classList.add('hidden')}if(f.ext==='md'&&mode!=='edit'){const md=document.createElement('div');md.style.cssText='width:100%;line-height:1.7;padding:15px;background:#192131;border-radius:10px';md.innerHTML=markdownLite(raw);wrap.insertBefore(md,editor);editor.classList.add('hidden')}if(f.ext==='svg'){const im=document.createElement('img');im.src=f.url;wrap.insertBefore(im,editor);editor.classList.add('hidden')}stage.appendChild(wrap);p.appendChild(stage);}
          function csvHtml(t){const rows=t.trim().split(/\r?\n/).slice(0,100).map(r=>r.split(',').map(x=>x.replace(/^"|"$/g,'')));if(!rows.length)return '';return '<table class="data-table">'+rows.map((r,i)=>'<tr>'+r.map(v=>i===0?'<th>'+escapeHtml(v)+'</th>':'<td>'+escapeHtml(v)+'</td>').join('')+'</tr>').join('')+'</table>'}
          function markdownLite(s){return escapeHtml(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>')}
