           addToolButton(bar,'Dönüştür',()=>convertCurrentImage());addToolButton(bar,'Boyutlandır',()=>resizeCurrentImage());addToolButton(bar,'Sıkıştır',()=>compressCurrentImage());addToolButton(bar,'PDF oluştur',()=>imageToPdf());addToolButton(bar,'PNG indir',()=>saveImage('image/png','png'),'primary');
           const stage=document.createElement('div');stage.className='stage';const canvas=document.createElement('canvas');canvas.id='imageCanvas';stage.appendChild(canvas);panel.appendChild(stage);imageCanvas=canvas;imageCtx=canvas.getContext('2d',{willReadFrequently:true});
           const img=new Image();img.onload=()=>{imageSource=img;const scale=Math.min(1,3200/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);imageFilters={brightness:100,contrast:100,saturate:100};drawImageCanvas();if(imageMode==='edit')addImageControls(panel);if(imageMode==='censor'){const hint=document.createElement('div');hint.className='control-row';hint.textContent='Sansürlenecek alanı görsel üzerinde sürükleyerek seç. Seçilen bölge pikselleştirilir ve dışa aktarmaya işlenir.';panel.appendChild(hint);enableCensor(canvas)}if(imageMode==='resize')setTimeout(resizeCurrentImage,100);if(imageMode==='compress')setTimeout(compressCurrentImage,100)};
