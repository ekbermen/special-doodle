          function showPage(name){['home','workspace','board','links','code'].forEach(p=>$('#'+(p==='home'?'homePage':p==='workspace'?'workspace':p+'Page')).classList.toggle('hidden',p!==name));$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('#pageTitle').textContent=({home:'Dosya stüdyosu',workspace:'Dosya çalışma alanı',board:'Beyaz tahta',links:'Bağlantı stüdyosu',code:'Kod laboratuvarı'})[name]||'NOVA Studio'}
